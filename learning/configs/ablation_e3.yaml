# E3: Large diversity, WITH regime change, WITH aux loss (full model)
# Data: reuse e2.h5 (same data as E2)
# Train: python -m learning.train --config learning/configs/ablation_e3.yaml --tensorboard

data:
  h5_path: learning/datasets/e2.h5
  dataset_name: e3
  n_trajectories: 5000
  traj_length_steps: 2000
  dt: 0.1

model:
  d_model: 128
  n_heads: 4
  n_layers: 4
  d_ff: 512
  dropout: 0.15
  context_length: 50
  prediction_horizon: 20

training:
  batch_size: 256
  learning_rate: 6.0e-4
  weight_decay: 1.0e-4
  max_epochs: 80
  warmup_steps: 200
  grad_clip: 1.0
  use_amp: true
  preload_dataset: true   # train/val 进内存加速；内存不够改 false
  curriculum_enabled: true
  curriculum_start_H: 1
  curriculum_epoch_per_step: 3

loss:
  horizon_decay: 0.95
  loss_type: huber
  huber_delta: 1.0
  channel_weights: [1.5, 1.5, 3.0, 1.0, 1.0, 2.5, 2.5, 2.5, 2.0, 2.0, 2.0, 1.5, 1.5, 1.5, 1.0, 1.0, 1.0]

rollout:
  enabled: true
  weight: 0.5
  warmup_epochs: 10
  steps: 0

aux_loss:
  enabled: true
  weight: 0.1
  predict_wind: true
  predict_params: false
