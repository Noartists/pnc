# Pilot experiment: small-scale validation (Phase 2)
# Generate: python -m learning.data_generation.dataset_generator --n-trajectories 1000 --dataset-name pilot
# Train:   python -m learning.train --config learning/configs/pilot.yaml

data:
  h5_path: learning/datasets/pilot.h5
  dataset_name: pilot
  n_trajectories: 1000
  traj_length_steps: 2000
  dt: 0.01

model:
  d_model: 128
  n_heads: 4
  n_layers: 4
  d_ff: 512
  dropout: 0.1
  context_length: 50
  prediction_horizon: 20

training:
  batch_size: 64
  learning_rate: 3.0e-4
  weight_decay: 1.0e-4
  max_epochs: 50
  warmup_steps: 200
  grad_clip: 1.0
  curriculum_enabled: true
  curriculum_start_H: 1
  curriculum_epoch_per_step: 3

loss:
  horizon_decay: 0.95
  loss_type: huber
  huber_delta: 1.0
