# Quick test: validate full pipeline with small dataset
# Train: python -m learning.train --config learning/configs/test.yaml

data:
  h5_path: learning/datasets/test.h5
  dataset_name: test
  n_trajectories: 200
  traj_length_steps: 500
  dt: 0.01

model:
  d_model: 64
  n_heads: 4
  n_layers: 2
  d_ff: 256
  dropout: 0.1
  context_length: 30
  prediction_horizon: 10

training:
  batch_size: 32
  learning_rate: 3.0e-4
  weight_decay: 1.0e-4
  max_epochs: 10
  warmup_steps: 50
  grad_clip: 1.0
  curriculum_enabled: true
  curriculum_start_H: 1
  curriculum_epoch_per_step: 2

loss:
  horizon_decay: 0.95
  loss_type: huber
  huber_delta: 1.0
