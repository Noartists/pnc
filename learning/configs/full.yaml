# Full-scale experiment (Phase 3)
# Generate: python -m learning.data_generation.dataset_generator --n-trajs 50000 --traj-length 2000 --subsample-step 10 --dataset-name full
# Train:   python -m learning.train --config learning/configs/full.yaml --tensorboard

data:
  h5_path: learning/datasets/full.h5
  dataset_name: full
  n_trajectories: 50000
  traj_length_steps: 2000
  dt: 0.1

model:
  d_model: 256
  n_heads: 8
  n_layers: 6
  d_ff: 1024
  dropout: 0.15
  context_length: 50
  prediction_horizon: 20

training:
  batch_size: 128
  learning_rate: 3.0e-4
  weight_decay: 1.0e-4
  max_epochs: 200
  warmup_steps: 1000
  grad_clip: 1.0
  curriculum_enabled: true
  curriculum_start_H: 1
  curriculum_epoch_per_step: 10

loss:
  horizon_decay: 0.95
  loss_type: huber
  huber_delta: 1.0
  channel_weights: [1.5, 1.5, 3.0, 1.0, 1.0, 2.5, 2.5, 2.5, 2.0, 2.0, 2.0, 1.5, 1.5, 1.5, 1.0, 1.0, 1.0]

rollout:
  enabled: true
  weight: 0.5
  warmup_epochs: 20
  steps: 0
